services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: embeddings
      CLICKHOUSE_USER: vectordbuser
      CLICKHOUSE_PASSWORD: pwd_vectordb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query \"SELECT count() FROM embeddings.vectors WHERE 1\" | grep -v '^0$$'",
        ]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: embeddings
      CLICKHOUSE_USER: vectordbuser
      CLICKHOUSE_PASSWORD: pwd_vectordb
      HF_HOME: /root/.cache/huggingface
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  huggingface-cache:
