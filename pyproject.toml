[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-engineer-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect[async]",
    "fastapi",
    "pydantic-settings",
    "sentence-transformers",
    "torch",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live ClickHouse instance",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".agents", ".claude", ".revmux"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rag_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


