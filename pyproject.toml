[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-engineer-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect[async]",
    "fastapi",
    "pydantic-settings",
    "sentence-transformers",
    "torch",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live ClickHouse instance",
]

