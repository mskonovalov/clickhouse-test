[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-engineer-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect[async]",
    "fastapi",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live ClickHouse instance",
]

